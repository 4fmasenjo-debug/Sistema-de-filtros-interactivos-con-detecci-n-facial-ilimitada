<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro de Mitología</title>
    <script defer src="./face-api.js"></script>
<script src="./script.js?v=2002" defer></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f0f0f0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            position: relative;
            width: 720px;
            height: 560px;
        }
        #video,
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 720px;
            height: 560px;
        }
        #video {
            transform: scaleX(-1);
            object-fit: cover;
        }
        #canvas {
            pointer-events: none;
        }
        /* Las imágenes solo sirven como fuentes para canvas */
        .assets {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <video
            id="video"
            width="720"
            height="560"
            autoplay
            muted
            playsinline>
        </video>
        <canvas
            id="canvas"
            width="720"
            height="560">
        </canvas>
    </div>
    <div class="assets">
        <img id="fenix-img" src="./Nueva carpeta/fénix.png" alt="">
        <img id="hipogrifo-img" src="./Nueva carpeta/hipogrifo.png" alt="">
        <img id="pegaso-img" src="./Nueva carpeta/pegaso.png" alt="">

        <img id="cerbero-img" src="./Nueva carpeta/cerbero.png" alt="">
        <img id="minotauro-img" src="./Nueva carpeta/minotauro.png" alt="">
        <img id="fenrir-img" src="./Nueva carpeta/fenrir.png" alt="">
        <img id="converted-img" src="./Nueva carpeta/converted_image.png" alt="">

        <img id="unicornio-img" src="./Nueva carpeta/unicornio.png" alt="">
        <img id="quetzalcoatl-img" src="./Nueva carpeta/quetzalcoatl.png" alt="">

        <video
            id="dragón-webm"
            src="./Nueva carpeta/dragón.webm"
            loop
            muted
            playsinline
            preload="auto">
        </video>
    </div>
</body>
</html>
